<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>룰렛 돌리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FBF6FB;
  --surface: #FFFFFF;
  --ink: #574E63;
  --ink-2: #A79BB5;
  --line: #ECE0EF;
  --accent: #C8B6EC;
  --accent-ink: #55486B;
  --accent-soft: #F3ECFB;
  --danger: #F2A6AE;
  --shadow: 0 1px 2px rgba(160,130,180,.07), 0 8px 24px rgba(160,130,180,.09);
  --font: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #26212F; --surface: #322B3D; --ink: #ECE5F2; --ink-2: #B4A8C6; --line: #423A50;
    --accent: #D3C2F2; --accent-ink: #322B3D; --accent-soft: #3E3550; --danger: #F2A6AE;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #26212F; --surface: #322B3D; --ink: #ECE5F2; --ink-2: #B4A8C6; --line: #423A50;
  --accent: #D3C2F2; --accent-ink: #322B3D; --accent-soft: #3E3550; --danger: #F2A6AE;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.page { max-width: 1180px; margin: 0 auto; padding: 20px 20px 40px; }
.page-head { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; margin: 0; }
.page-head p { margin: 0; color: var(--ink-2); font-size: 14px; }

.layout { display: grid; grid-template-columns: 380px minmax(0,1fr); gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

/* Panel */
.panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-head h2 { font-size: 17px; margin: 0; font-weight: 700; }
.count { color: var(--ink-2); font-weight: 500; font-size: 14px; margin-left: 6px; }

.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 8px 14px; min-height: 40px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.text { border-color: transparent; background: transparent; color: var(--ink-2); padding: 8px 10px; }
.btn.text:hover { background: var(--accent-soft); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--ink);
}
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-weight: 500; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.track { width: 42px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + .track { background: #8CA5F5; }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }

.cols { display: grid; grid-template-columns: 14px minmax(0,1fr) 64px 40px 30px; gap: 8px; padding: 0 2px; color: var(--ink-2); font-size: 12.5px; }
.cols span:nth-child(2) { grid-column: 2; }
.list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100dvh - 370px); min-height: 200px; overflow-y: auto; padding: 2px; margin: -2px; }
.row { display: grid; grid-template-columns: 14px minmax(0,1fr) 64px 40px 30px; gap: 8px; align-items: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 0; padding: 0; background: var(--line); }
.row.off .dot { cursor: pointer; box-shadow: 0 0 0 2px var(--line) inset; background: transparent; }
.row.off input.name { text-decoration: line-through; color: var(--ink-2); }
.row input {
  width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); transition: border-color .15s, background .15s;
}
.row input:focus { border-color: var(--accent); background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.row input.w { text-align: center; padding: 6px 4px; }
.pct { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.del { width: 30px; height: 30px; border: 0; background: transparent; color: var(--ink-2); border-radius: 8px; font-size: 20px; line-height: 1; padding: 0; }
.del:hover { background: var(--accent-soft); color: var(--danger); }
.panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Stage */
.stage { position: relative; padding: 18px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.toolbar { align-self: stretch; display: flex; justify-content: flex-end; gap: 8px; }
.wheel-wrap {
  position: relative; width: min(100%, 600px, max(280px, calc(100dvh - 300px))); aspect-ratio: 1;
  container-type: inline-size; margin-top: 2px;
}
.wheel-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 22px rgba(20,30,60,.18)); }
.pointer {
  position: absolute; top: -3cqw; left: 50%; width: 9cqw; height: 10cqw; margin-left: -4.5cqw; z-index: 3;
  transform-origin: 50% 20%; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3));
}
.pointer svg { width: 100%; height: 100%; display: block; }
.hub {
  position: absolute; z-index: 2; top: 50%; left: 50%; width: 20cqw; height: 20cqw; transform: translate(-50%,-50%);
  border-radius: 50%; border: 0; background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 1.4cqw var(--accent), 0 4px 14px rgba(20,30,60,.22);
  font-size: 4.6cqw; font-weight: 900; letter-spacing: 0.06em; padding: 0;
  transition: transform .15s;
}
.hub:hover:not([disabled]) { transform: translate(-50%,-50%) scale(1.04); }
.hub[disabled] { color: var(--ink-2); cursor: not-allowed; }
.spin-btn { min-width: 200px; min-height: 52px; font-size: 18px; border-radius: 14px; }
.hint { color: var(--ink-2); font-size: 13.5px; margin: 0; text-align: center; min-height: 20px; }

.history { align-self: stretch; border-top: 1px solid var(--line); padding-top: 14px; }
.history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-size: 13.5px; }
.chip:first-child { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Result */
.result {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  border-radius: inherit; padding: 16px;
}
.result[hidden] { display: none; }
.result-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 32px 22px;
  box-shadow: 0 20px 60px rgba(20,30,60,.28); text-align: center; max-width: min(92%, 640px); min-width: min(320px, 92%);
  animation: pop .28s cubic-bezier(.2,1.1,.4,1);
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-label { color: var(--ink-2); font-size: 14px; margin: 0 0 6px; }
.result-name { font-size: clamp(34px, 9vw, 64px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; margin: 0; word-break: keep-all; overflow-wrap: anywhere; color: var(--ink); }
.result-note { color: var(--ink-2); font-size: 13px; margin: 10px 0 0; min-height: 19px; }
.result-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

.toast {
  position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; z-index: 20;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; transition: opacity .2s, transform .2s;
  max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Fullscreen */
.stage.fs, .stage:fullscreen { background: var(--bg); border: 0; border-radius: 0; box-shadow: none; justify-content: center; gap: 20px; padding: 20px; width: 100%; height: 100%; }
.stage.fs .wheel-wrap { width: min(94vw, max(260px, calc(100dvh - 190px))); }
.stage.fs .history, .stage.fs .hint { display: none; }
.stage.fs .toolbar { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; align-self: auto; z-index: 15; }
.stage.fs .result-card { padding: 36px 48px 28px; }
.stage.fs .result-name { font-size: clamp(44px, 12vw, 120px); }
.stage.pseudo-fs { position: fixed; inset: 0; z-index: 1000; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(520px, calc(100vw - 28px)); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,15,25,.5); }
.dlg { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; }
.dlg-head h2 { margin: 0; font-size: 18px; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px; min-height: 38px; color: var(--ink-2); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(20,30,60,.15); }
.pane[hidden] { display: none; }
.pane { display: flex; flex-direction: column; gap: 12px; }
.pane p { margin: 0; color: var(--ink-2); font-size: 14px; }
textarea, .num { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); resize: vertical; }
textarea:focus, .num:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.range { display: flex; align-items: center; gap: 10px; }
.range label { display: flex; align-items: center; gap: 8px; flex: 1; font-weight: 500; }
.range .num { text-align: center; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.presets .btn { justify-content: flex-start; text-align: left; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .stage { order: -1; }
  .list { max-height: 420px; }
  .wheel-wrap { width: min(100%, 560px); }
  .page { padding: 14px 12px 32px; }
  .page-head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .result-card { animation: none; }
  * { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="page-head">
    <h1>룰렛 돌리기</h1>
    <p>항목을 입력하고 돌려 보세요. 가중치를 높이면 더 자주 뽑혀요.</p>
  </header>

  <div class="layout">
    <section class="card panel" aria-label="룰렛 항목 생성">
      <div class="panel-head">
        <h2>룰렛 항목<span class="count" id="count"></span></h2>
        <button class="btn" id="quickBtn" type="button">빠른 생성</button>
      </div>

      <label class="switch">
        <input type="checkbox" id="excludeSwitch">
        <span class="track"></span>
        <span>뽑힌 항목 제외하기</span>
      </label>

      <div class="cols" aria-hidden="true"><span></span><span>이름</span><span style="text-align:center">가중치</span><span></span><span></span></div>
      <div class="list" id="list"></div>

      <div class="panel-foot">
        <button class="btn" id="addBtn" type="button">+ 항목 추가</button>
        <span>
          <button class="btn text" id="restoreBtn" type="button" hidden>제외 초기화</button>
          <button class="btn text" id="clearBtn" type="button">전체 삭제</button>
        </span>
      </div>
    </section>

    <section class="card stage" id="stage" aria-label="룰렛">
      <div class="toolbar">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="효과음 끄기" title="효과음"></button>
        <button class="btn" id="fsBtn" type="button"></button>
      </div>

      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel" aria-label="룰렛 판" role="img"></canvas>
        <div class="pointer" id="pointer" aria-hidden="true">
          <svg viewBox="0 0 40 46"><path d="M20 44 3 12C-1 5 4 0 10 0h20c6 0 11 5 7 12L20 44z" fill="var(--ink)" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round"/></svg>
        </div>
        <button class="hub" id="hub" type="button" aria-label="룰렛 돌리기">START</button>
      </div>

      <button class="btn primary spin-btn" id="spinBtn" type="button">돌리기</button>
      <p class="hint" id="hint"></p>

      <div class="history" id="history" hidden>
        <div class="history-head"><span>뽑은 기록</span><button class="btn text" id="histClear" type="button">기록 지우기</button></div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-card" role="dialog" aria-live="polite" aria-label="뽑기 결과">
          <p class="result-label">뽑힌 항목</p>
          <p class="result-name" id="resultName"></p>
          <p class="result-note" id="resultNote"></p>
          <div class="result-actions">
            <button class="btn primary" id="againBtn" type="button">다시 돌리기</button>
            <button class="btn" id="closeResult" type="button">확인</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast" role="status"></div>
    </section>
  </div>
</div>

<dialog id="qc">
  <div class="dlg">
    <div class="dlg-head">
      <h2>빠른 생성</h2>
      <button class="icon-btn" id="qcClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="names" aria-selected="true">이름 입력</button>
      <button type="button" role="tab" data-tab="numbers" aria-selected="false">번호</button>
      <button type="button" role="tab" data-tab="presets" aria-selected="false">예시</button>
    </div>

    <div class="pane" data-pane="names">
      <p>한 줄에 하나씩, 또는 쉼표로 구분해서 붙여넣으세요.</p>
      <textarea id="qcNames" rows="8" placeholder="김하늘&#10;이도윤&#10;박서연"></textarea>
      <div class="actions">
        <button class="btn" id="qcAppend" type="button">현재 항목에 추가</button>
        <button class="btn primary" id="qcReplace" type="button">새로 만들기</button>
      </div>
    </div>

    <div class="pane" data-pane="numbers" hidden>
      <p>번호 항목을 한 번에 만들어요. 최대 100개까지 만들 수 있어요.</p>
      <div class="range">
        <label>시작 <input class="num" id="qcFrom" type="number" min="0" max="999" value="1"></label>
        <label>끝 <input class="num" id="qcTo" type="number" min="0" max="999" value="25"></label>
      </div>
      <div class="actions">
        <button class="btn primary" id="qcRange" type="button">번호로 새로 만들기</button>
      </div>
    </div>

    <div class="pane" data-pane="presets" hidden>
      <p>자주 쓰는 구성을 골라 바로 시작하세요.</p>
      <div class="presets" id="presets"></div>
    </div>
  </div>
</dialog>

<script>
(() => {
  const FONT = "'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif";
  const PALETTE = ['#FFB8C6','#FFD9B3','#FFF2A6','#BDEFC9','#B3E9EC','#B9D3FF','#D9C2FF','#F8C8E8','#D3E8A8','#FFCDB0','#A9DDFB','#E7CCFF'];
  const TWO = Math.PI * 2;
  const MAX_ITEMS = 100;
  const KEY = 'roulette-v1';
  const PRESETS = [
    { name: '예 / 아니오', items: ['예', '아니오'] },
    { name: 'O / X', items: ['O', 'X'] },
    { name: '가위 · 바위 · 보', items: ['가위', '바위', '보'] },
    { name: '점심 메뉴', items: ['한식', '중식', '일식', '양식', '분식', '샐러드'] },
    { name: '1모둠 ~ 6모둠', items: ['1모둠', '2모둠', '3모둠', '4모둠', '5모둠', '6모둠'] },
    { name: '청소 역할', items: ['칠판 지우기', '바닥 쓸기', '책상 줄 맞추기', '쓰레기통 비우기', '창틀 닦기'] }
  ];
  const ICON = {
    expand: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
    shrink: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3a2 2 0 0 0 2-2V3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M21 16h-3a2 2 0 0 0-2 2v3"/></svg>',
    on: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    off: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>'
  };

  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), wrap = $('#wheelWrap'), canvas = $('#wheel'), ctx = canvas.getContext('2d');
  const listEl = $('#list'), countEl = $('#count'), hintEl = $('#hint');
  const spinBtn = $('#spinBtn'), hub = $('#hub'), pointer = $('#pointer');
  const resultEl = $('#result'), resultName = $('#resultName'), resultNote = $('#resultNote');
  const historyEl = $('#history'), chipsEl = $('#chips');
  const excludeSwitch = $('#excludeSwitch'), restoreBtn = $('#restoreBtn');
  const soundBtn = $('#soundBtn'), fsBtn = $('#fsBtn'), toastEl = $('#toast'), qc = $('#qc');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let uid = 0, items = [], rot = 0, spinning = false, history = [], soundOn = true, excludeOn = false, pending = null, segs = [];

  const mod = (a, n) => ((a % n) + n) % n;
  const clampW = (v) => { v = parseInt(v, 10); return isNaN(v) ? 1 : Math.max(1, Math.min(99, v)); };
  const mk = (name = '', weight = 1, excluded = false) => ({ id: ++uid, name, weight, excluded });

  /* ---------- storage ---------- */
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        items: items.map(({ name, weight, excluded }) => ({ name, weight, excluded })),
        excludeOn, soundOn, history
      }));
    } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Array.isArray(d.items) && d.items.length) {
        items = d.items.slice(0, MAX_ITEMS).map(i => mk(String(i.name || '').slice(0, 30), clampW(i.weight), !!i.excluded));
      }
      excludeOn = !!d.excludeOn;
      soundOn = d.soundOn !== false;
      history = Array.isArray(d.history) ? d.history.slice(0, 30).map(String) : [];
    } catch (e) {}
  }

  /* ---------- data helpers ---------- */
  const getActive = () => items.filter(i => i.name.trim() && !i.excluded && i.weight > 0);

  function buildSegs() {
    const act = getActive();
    const total = act.reduce((s, i) => s + i.weight, 0);
    const n = act.length;
    let a = 0;
    segs = act.map((it, i) => {
      const ang = it.weight / total * TWO;
      let c = i % PALETTE.length;
      if (i === n - 1 && n > 1 && c === 0) c = Math.floor(PALETTE.length / 2);
      const s = { it, start: a, end: a + ang, color: PALETTE[c] };
      a += ang;
      return s;
    });
    return total;
  }

  function isLight(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 165;
  }
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#fff';

  /* ---------- drawing ---------- */
  function fit(t, maxW) {
    if (ctx.measureText(t).width <= maxW) return t;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  function draw() {
    const s = wrap.clientWidth;
    if (!s) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const px = Math.round(s * dpr);
    if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, s, s);
    const c = s / 2, R = s / 2 - 5;
    const surface = cssVar('--surface');
    buildSegs();

    if (segs.length < 2) {
      ctx.beginPath(); ctx.arc(c, c, R, 0, TWO);
      ctx.fillStyle = cssVar('--line'); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = surface; ctx.stroke();
      ctx.fillStyle = cssVar('--ink-2');
      ctx.font = `500 ${Math.max(13, s * 0.032)}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('항목을 2개 이상 입력해 주세요', c, c + s * 0.17);
      return;
    }

    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(rot);
    const wr = R - 3;
    segs.forEach(sg => {
      const ang = sg.end - sg.start;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, wr, sg.start, sg.end); ctx.closePath();
      ctx.fillStyle = sg.color; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();

      ctx.save();
      ctx.rotate(sg.start + ang / 2);
      ctx.fillStyle = '#2B3445';
      const arcLen = ang * wr * 0.55;
      const fs = Math.max(10, Math.min(wr * 0.115, arcLen * 0.72, 30));
      ctx.font = `700 ${fs}px ${FONT}`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const label = fit(sg.it.name.trim(), wr * 0.6);
      ctx.fillText(label, wr - wr * 0.07, 0);
      ctx.restore();
    });
    ctx.restore();

    ctx.beginPath(); ctx.arc(c, c, R, 0, TWO);
    ctx.lineWidth = 6; ctx.strokeStyle = surface; ctx.stroke();
  }

  /* ---------- list UI ---------- */
  function renderList() {
    listEl.innerHTML = '';
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = it.id;
      row.innerHTML = '<button type="button" class="dot" tabindex="-1" aria-hidden="true"></button>' +
        '<input class="name" type="text" maxlength="30" placeholder="이름" aria-label="항목 이름">' +
        '<input class="w" type="number" min="1" max="99" step="1" aria-label="가중치">' +
        '<span class="pct"></span>' +
        '<button type="button" class="del" aria-label="항목 삭제">×</button>';
      const nameIn = row.querySelector('.name'), wIn = row.querySelector('.w');
      nameIn.value = it.name;
      wIn.value = it.weight;

      nameIn.addEventListener('input', () => { it.name = nameIn.value; onChange(); });
      nameIn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (items.length >= MAX_ITEMS) return;
          const idx = items.indexOf(it);
          const n = mk();
          items.splice(idx + 1, 0, n);
          renderList(); onChange(); focusRow(n.id);
        }
      });
      nameIn.addEventListener('paste', (e) => {
        const t = (e.clipboardData || window.clipboardData).getData('text');
        if (!/[\n\r]/.test(t)) return;
        e.preventDefault();
        const parts = t.split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
        if (!parts.length) return;
        const idx = items.indexOf(it);
        it.name = parts[0].slice(0, 30);
        const extra = parts.slice(1).map(p => mk(p.slice(0, 30)));
        items.splice(idx + 1, 0, ...extra);
        items = items.slice(0, MAX_ITEMS);
        renderList(); onChange();
      });
      wIn.addEventListener('input', () => { const v = parseInt(wIn.value, 10); it.weight = isNaN(v) ? 0 : Math.max(0, Math.min(99, v)); onChange(); });
      wIn.addEventListener('blur', () => { it.weight = clampW(wIn.value); wIn.value = it.weight; onChange(); });
      row.querySelector('.del').addEventListener('click', () => {
        items = items.filter(x => x !== it);
        renderList(); onChange();
      });
      row.querySelector('.dot').addEventListener('click', () => {
        if (it.excluded) { it.excluded = false; renderList(); onChange(); }
      });
      listEl.appendChild(row);
    });
    updateMeta();
  }

  function focusRow(id) {
    const r = listEl.querySelector(`.row[data-id="${id}"] .name`);
    if (r) { r.focus(); r.scrollIntoView({ block: 'nearest' }); }
  }

  function updateMeta() {
    buildSegs();
    const total = segs.reduce((s, x) => s + x.it.weight, 0);
    const colorOf = new Map(segs.map(s => [s.it.id, s.color]));
    listEl.querySelectorAll('.row').forEach(row => {
      const it = items.find(i => i.id === Number(row.dataset.id));
      if (!it) return;
      const dot = row.querySelector('.dot'), pct = row.querySelector('.pct');
      row.classList.toggle('off', it.excluded);
      dot.title = it.excluded ? '눌러서 다시 포함하기' : '';
      dot.style.background = it.excluded ? '' : (colorOf.get(it.id) || '');
      pct.textContent = colorOf.has(it.id) && total ? Math.round(it.weight / total * 100) + '%' : '';
    });
    const n = segs.length;
    countEl.textContent = n ? `${n}개` : '';
    restoreBtn.hidden = !items.some(i => i.excluded);
    const ok = n >= 2 && !spinning;
    spinBtn.disabled = !ok; hub.disabled = !ok;
    hintEl.textContent = n < 2 ? '항목을 2개 이상 입력하면 돌릴 수 있어요.' : (excludeOn ? '뽑힌 항목은 다음 돌리기부터 제외돼요.' : '');
  }

  function onChange() { save(); updateMeta(); draw(); }

  /* ---------- history ---------- */
  function renderHistory() {
    chipsEl.innerHTML = '';
    history.forEach(h => { const s = document.createElement('span'); s.className = 'chip'; s.textContent = h; chipsEl.appendChild(s); });
    historyEl.hidden = history.length === 0;
  }

  /* ---------- sound ---------- */
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function beep(freq, dur, vol, type) {
    if (!soundOn) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function chime() {
    beep(659, 0.25, 0.12); setTimeout(() => beep(880, 0.25, 0.12), 120); setTimeout(() => beep(1175, 0.45, 0.12), 250);
  }
  function renderSoundBtn() {
    soundBtn.innerHTML = soundOn ? ICON.on : ICON.off;
    soundBtn.setAttribute('aria-label', soundOn ? '효과음 끄기' : '효과음 켜기');
  }

  /* ---------- spin ---------- */
  function idxAt(a) {
    const w = mod(-Math.PI / 2 - a, TWO);
    for (let i = 0; i < segs.length; i++) if (w >= segs[i].start && w < segs[i].end) return i;
    return segs.length - 1;
  }

  function spin() {
    if (spinning) return;
    closeResult();
    buildSegs();
    if (segs.length < 2) { toast(segs.length ? '남은 항목이 부족해요. 제외 초기화를 눌러 주세요.' : '항목을 2개 이상 입력해 주세요.'); return; }
    audio();
    const total = segs.reduce((s, x) => s + x.it.weight, 0);
    let x = Math.random() * total, wi = segs.length - 1;
    for (let i = 0; i < segs.length; i++) { x -= segs[i].it.weight; if (x < 0) { wi = i; break; } }
    const sg = segs[wi];
    const target = sg.start + (0.12 + Math.random() * 0.76) * (sg.end - sg.start);
    const base = mod(-Math.PI / 2 - target, TWO);
    const delta = mod(base - mod(rot, TWO), TWO) + TWO * (6 + Math.floor(Math.random() * 3));
    const from = rot, to = rot + delta;
    const dur = reduceMotion ? 1600 : 5200 + Math.random() * 1200;
    const winner = sg.it;
    let last = idxAt(from);
    spinning = true; updateMeta();
    const t0 = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 4);
      rot = from + (to - from) * e;
      draw();
      const cur = idxAt(rot);
      if (cur !== last) {
        last = cur;
        beep(1000 + Math.random() * 60, 0.035, 0.05, 'square');
        if (!reduceMotion && pointer.animate) pointer.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-16deg)' }, { transform: 'rotate(0deg)' }], { duration: 130 });
      }
      if (p < 1) requestAnimationFrame(frame);
      else finish(winner);
    }
    requestAnimationFrame(frame);
  }

  function finish(winner) {
    spinning = false;
    chime();
    history.unshift(winner.name.trim());
    history = history.slice(0, 30);
    renderHistory();
    if (excludeOn) pending = winner;
    resultName.textContent = winner.name.trim();
    resultNote.textContent = excludeOn ? '다음 돌리기부터 제외돼요.' : '';
    resultEl.hidden = false;
    $('#againBtn').focus({ preventScroll: true });
    updateMeta(); save();
  }

  function applyPending() {
    if (pending) { pending.excluded = true; pending = null; renderList(); onChange(); }
  }
  function closeResult() {
    if (resultEl.hidden) return;
    resultEl.hidden = true;
    applyPending();
  }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  /* ---------- fullscreen ---------- */
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  const isFS = () => fsElement() === stage || stage.classList.contains('pseudo-fs');
  function syncFS() {
    const on = isFS();
    stage.classList.toggle('fs', on);
    fsBtn.innerHTML = (on ? ICON.shrink : ICON.expand) + '<span>' + (on ? '전체화면 끝내기' : '전체화면') + '</span>';
    requestAnimationFrame(draw);
  }
  function pseudoOn() { stage.classList.add('pseudo-fs'); document.body.classList.add('lock'); syncFS(); }
  function pseudoOff() { stage.classList.remove('pseudo-fs'); document.body.classList.remove('lock'); }
  function toggleFS() {
    if (isFS()) {
      if (fsElement()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
      pseudoOff(); syncFS();
      return;
    }
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) {
      try {
        const p = req.call(stage);
        if (p && p.catch) p.catch(pseudoOn);
      } catch (e) { pseudoOn(); }
    } else pseudoOn();
  }
  document.addEventListener('fullscreenchange', () => { if (!fsElement()) pseudoOff(); syncFS(); });
  document.addEventListener('webkitfullscreenchange', () => { if (!fsElement()) pseudoOff(); syncFS(); });

  /* ---------- quick create ---------- */
  function parseNames(text) {
    return text.split(/[\r\n,]+/).map(s => s.trim()).filter(Boolean).map(s => s.slice(0, 30));
  }
  function setItems(names, append) {
    let list = names.map(n => mk(n));
    if (append) list = items.filter(i => i.name.trim()).concat(list);
    if (list.length > MAX_ITEMS) { list = list.slice(0, MAX_ITEMS); toast('항목은 최대 100개까지 만들 수 있어요.'); }
    items = list.length ? list : [mk(), mk()];
    pending = null; rot = 0;
    renderList(); onChange();
  }

  /* ---------- events ---------- */
  spinBtn.addEventListener('click', spin);
  hub.addEventListener('click', spin);
  $('#againBtn').addEventListener('click', () => { closeResult(); spin(); });
  $('#closeResult').addEventListener('click', closeResult);
  $('#addBtn').addEventListener('click', () => {
    if (items.length >= MAX_ITEMS) { toast('항목은 최대 100개까지 만들 수 있어요.'); return; }
    const n = mk(); items.push(n); renderList(); onChange(); focusRow(n.id);
  });
  $('#clearBtn').addEventListener('click', () => {
    if (!items.some(i => i.name.trim())) return;
    if (confirm('모든 항목을 삭제할까요?')) { items = [mk(), mk()]; pending = null; renderList(); onChange(); }
  });
  restoreBtn.addEventListener('click', () => { items.forEach(i => i.excluded = false); pending = null; renderList(); onChange(); });
  excludeSwitch.addEventListener('change', () => { excludeOn = excludeSwitch.checked; if (!excludeOn) pending = null; save(); updateMeta(); });
  $('#histClear').addEventListener('click', () => { history = []; renderHistory(); save(); });
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; renderSoundBtn(); save(); if (soundOn) beep(880, 0.12, 0.1); });
  fsBtn.addEventListener('click', toggleFS);

  $('#quickBtn').addEventListener('click', () => { qc.showModal(); });
  $('#qcClose').addEventListener('click', () => qc.close());
  qc.addEventListener('click', (e) => { if (e.target === qc) qc.close(); });
  qc.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    qc.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    qc.querySelectorAll('.pane').forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab);
  }));
  $('#qcAppend').addEventListener('click', () => {
    const names = parseNames($('#qcNames').value);
    if (!names.length) { $('#qcNames').focus(); return; }
    setItems(names, true); $('#qcNames').value = ''; qc.close();
  });
  $('#qcReplace').addEventListener('click', () => {
    const names = parseNames($('#qcNames').value);
    if (!names.length) { $('#qcNames').focus(); return; }
    setItems(names, false); $('#qcNames').value = ''; qc.close();
  });
  $('#qcRange').addEventListener('click', () => {
    let a = parseInt($('#qcFrom').value, 10), b = parseInt($('#qcTo').value, 10);
    if (isNaN(a) || isNaN(b)) return;
    if (a > b) [a, b] = [b, a];
    const names = [];
    for (let i = a; i <= b && names.length < MAX_ITEMS + 1; i++) names.push(String(i));
    setItems(names, false); qc.close();
  });
  const presetBox = $('#presets');
  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = p.name;
    b.addEventListener('click', () => { setItems(p.items, false); qc.close(); });
    presetBox.appendChild(b);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (stage.classList.contains('pseudo-fs')) { pseudoOff(); syncFS(); return; }
      if (!resultEl.hidden && !qc.open) { closeResult(); return; }
    }
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if ((e.code === 'Space') && !['INPUT', 'TEXTAREA', 'BUTTON', 'SELECT'].includes(tag) && !qc.open) {
      e.preventDefault(); spin();
    }
  });

  new ResizeObserver(() => draw()).observe(wrap);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  window.addEventListener('resize', draw);

  /* ---------- init ---------- */
  load();
  if (!items.length) items = ['1번', '2번', '3번', '4번', '5번', '6번'].map(n => mk(n));
  excludeSwitch.checked = excludeOn;
  renderSoundBtn(); syncFS(); renderHistory(); renderList(); draw();
  if (document.fonts) {
    document.fonts.load(`700 16px 'Noto Sans KR'`).then(draw).catch(() => {});
    document.fonts.ready.then(draw);
  }
})();
</script>
</body>
</html>
